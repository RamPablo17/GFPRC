<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamo de Sr. Toño | GFRC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800">
    <div class="min-h-screen">
        <header class="bg-indigo-700 text-white shadow-md">
            <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center justify-between gap-4 px-5 py-4 sm:px-8">
                <div class="inline-flex items-center gap-3">
                    <span class="flex h-10 w-10 items-center justify-center rounded-xl border border-indigo-500 bg-indigo-600">
                        <i class="fa-solid fa-arrow-left"></i>
                    </span>
                    <span>
                        <span class="block text-lg font-bold">GFRC</span>
                        <span class="block text-xs text-indigo-200">Acceso de solo lectura</span>
                    </span>
                </div>
                <div class="flex items-center gap-3">
                    <span id="correoUsuarioSrTono" class="max-w-[45vw] truncate text-xs text-indigo-100"></span>
                    <button id="botonCerrarSesionSrTono" type="button" class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium transition hover:bg-indigo-500" title="Cerrar sesión">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="mx-auto w-full max-w-6xl space-y-6 px-5 py-8 sm:px-8">
            <div id="mensajeSrTono" role="status" aria-live="polite" class="hidden rounded-xl border px-4 py-3 text-sm"></div>
            <section id="accesoRequeridoSrTono" class="hidden rounded-2xl border border-slate-200 bg-white px-6 py-12 text-center shadow-sm">
                <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">
                    <i class="fa-solid fa-lock text-xl"></i>
                </div>
                <h1 class="mt-4 text-lg font-bold text-slate-900">Acceso solo para Toñito</h1>
                <p class="mt-1 text-sm text-slate-500">Inicia sesión con la cuenta autorizada para consultar el préstamo.</p>
                <a href="index.html" class="mt-5 inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700">
                    <i class="fa-solid fa-arrow-left"></i> Ir a iniciar sesión
                </a>
            </section>

            <section id="contenidoSrTono" class="hidden space-y-6">
                <div class="flex flex-col gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:flex-row sm:items-center sm:justify-between sm:p-7">
                    <div class="flex items-start gap-4">
                        <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600">
                            <i class="fa-solid fa-handshake text-xl"></i>
                        </span>
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-wider text-emerald-700">Control de préstamo</p>
                            <h1 class="mt-1 text-2xl font-bold text-slate-900">Préstamo de Sr. Toño</h1>
                            <p class="mt-1 text-sm text-slate-500">Saldo, monto original y desglose de todos los abonos registrados.</p>
                        </div>
                    </div>
                </div>
                <div id="contenedorPrestamosSrTono" class="space-y-5"></div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="sr-tono.js"></script>
</body>
</html>
